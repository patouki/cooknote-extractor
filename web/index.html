function seedState(){const today=new Date(), t=isoDate(today), tomorrow=isoDate(addDays(today,1));return {recipes:seedRecipes(),folders:['Plats du soir','Healthy','Petit-déjeuner'],plan:{[`${t}|dinner`]:{recipeId:'demo1',servings:2},[`${tomorrow}|lunch`]:{recipeId:'demo2',servings:2}},groceries:[],view:'home'};}
function loadState(){try{let raw=localStorage.getItem(STORE);if(raw){let parsed=JSON.parse(raw);if(Array.isArray(parsed.recipes)&&Array.isArray(parsed.folders)&&parsed.plan&&Array.isArray(parsed.groceries))return parsed;}}catch(e){console.warn('État local indisponible',e)}return seedState();}
let state=loadState();let route='home', recipeSearch='', recipeFilter='all', activeFolder='', currentWeek=startWeek(new Date());let modalMode='url';let detailServings=null;let checkedIngredients=new Set();let plannerSlot='';let pickerSource='';let toastTimer=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));return true;}catch(err){toast('Sauvegarde saturée ou bloquée : exportez vos données');return false;}}
function recipeById(id){return state.recipes.find(r=>r.id===id);}
function formatQty(n){if(n===null||n===undefined||n==='')return '';const v=Number(n);if(!Number.isFinite(v))return String(n);if(Number.isInteger(v))return String(v);return String(Math.round(v*100)/100).replace('.',',');}
function formatAmount(ing,ratio=1){let q=ing.qty===null||ing.qty===undefined?'':formatQty(Number(ing.qty)*ratio);return [q,ing.unit].filter(Boolean).join(' ').trim();}
function guessCategory(name){let s=normalized(name);if(/tomat|oignon|carott|avocat|concombre|poivron|epinard|salade|basilic|citron|ail|banane|courgette|pomme de terre|potimarron|fraise|champignon|pomme|persil|aubergine|fruit|legume/.test(s))return 'Fruits & légumes';if(/lait|creme|oeuf|fromage|parmesan|beurre|yaourt|burrata|mozzarella|feta/.test(s))return 'Crèmerie & œufs';if(/saumon|poulet|boeuf|porc|thon|crevette|viande|poisson|jambon/.test(s))return 'Viandes & poissons';if(/pain|baguette|brioche|croissant/.test(s))return 'Boulangerie';if(/surgel/.test(s))return 'Surgelés';return 'Épicerie';}
function mealName(slot){return slot==='lunch'?'Déjeuner':'Dîner';}
function getMealsForDay(day){return ['lunch','dinner'].map(type=>({type,slot:state.plan[`${isoDate(day)}|${type}`]}));}
function weekSlots(){let slots=[];for(let i=0;i<7;i++){let d=addDays(currentWeek,i);for(let type of ['lunch','dinner']){const key=`${isoDate(d)}|${type}`;if(state.plan[key])slots.push({...state.plan[key],key,date:d,type});}}return slots;}
function groceriesFromSlots(){const map=new Map();for(let slot of weekSlots()){let r=recipeById(slot.recipeId);if(!r)continue;let ratio=(slot.servings||r.servings)/r.servings;for(let ing of r.ingredients||[]){let key=`${normalized(ing.name)}|${normalized(ing.unit)}|${ing.category}`;if(!map.has(key))map.set(key,{id:'auto-'+key,name:ing.name,qty:0,unit:ing.unit||'',category:ing.category||guessCategory(ing.name),done:false,source:'plan'});map.get(key).qty+=(Number(ing.qty)||0)*ratio;}}return Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name,'fr'));}
function generateGroceries(){let existing=new Map(state.groceries.map(x=>[x.id,x]));let manual=state.groceries.filter(x=>x.source==='manual');state.groceries=[...groceriesFromSlots().map(item=>({...item,done:existing.get(item.id)?.done||false})),...manual];save();}
function art(r,large=false){let bg=r.color||COLORS[0];let photo=r.photo?`<img src="${escapeHTML(r.photo)}" style="position:absolute;width:100%;height:100%;object-fit:cover;inset:0;z-index:1" alt="Photo de la recette">`:'';return `<div class="dish-art ${large?'large':''}" style="--dish-bg:${bg}">${photo||`<div class="dish-plate"><span class="dish-emoji">${escapeHTML(r.emoji||'🍽️')}</span></div>`}</div>`;}
function card(r){let pending=r.pending?'<span class="mini-label">À compléter</span>':`<span class="mini-label">${escapeHTML(r.tags?.[0]||'Ma recette')}</span>`;return `<article class="recipe-card" data-action="detail" data-id="${escapeHTML(r.id)}" tabindex="0" role="button" aria-label="Ouvrir ${escapeHTML(r.title)}"><div style="position:relative">${art(r)}${pending}<button class="favorite-btn ${r.favorite?'active':''}" data-action="favorite" data-id="${escapeHTML(r.id)}" aria-label="Favori">${r.favorite?'♥':'♡'}</button></div><div class="recipe-info"><h3 class="recipe-title">${escapeHTML(r.title)}</h3><p class="recipe-description">${escapeHTML(r.description||'Votre recette enregistrée, prête à être retrouvée.')}</p><div class="recipe-meta"><span><span class="mini-clock">◷</span> ${r.minutes?`${r.minutes} min`:'Temps libre'}</span><span>♧ ${r.servings||2} pers.</span></div></div></article>`;}
function empty(title,description,button='Ajouter une recette',action='open-import'){return `<div class="empty-state"><div class="empty-icon">✳</div><h3>${title}</h3><p>${description}</p><button class="btn" data-action="${action}">${button} <span>↗</span></button></div>`;}
function heading(title,desc,buttonText,action){return `<div class="inner-header"><div><div class="eyebrow">VOTRE CUISINE, VOS ENVIES</div><h1 class="h1">${title}</h1><p class="subheading">${desc}</p></div>${buttonText?`<button class="btn" data-action="${action}">+ ${buttonText}</button>`:''}</div>`;}
function renderHome(){const t=new Date();let todayISO=isoDate(t), total=state.recipes.length, favorites=state.recipes.filter(r=>r.favorite).length, planned=Object.keys(state.plan).filter(k=>k.startsWith(todayISO)).length;let top=state.recipes.slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,3);let chips=Array.from({length:7},(_,i)=>{const d=addDays(startWeek(t),i);return `<button data-action="home-day" data-date="${isoDate(d)}" class="week-chip ${isoDate(d)===todayISO?'selected':''}"><small>${DAYS[d.getDay()].slice(0,3)}</small><strong>${d.getDate()}</strong></button>`}).join('');let meals=getMealsForDay(t);return `<div class="eyebrow">BONJOUR, CHEF 👋</div><h1 class="h1">Un peu de <em>bon</em> dans<br>votre quotidien.</h1><p class="subheading">Vos meilleures idées cuisine, toutes au même endroit.</p><section class="hero"><div class="hero-content"><span class="hero-small">✳ VOTRE PROCHAINE INSPIRATION</span><h2>Une recette repérée ?<br>Ne la perdez plus.</h2><p>Un lien, du texte ou une idée : gardez vos découvertes et retrouvez-les quand vous voulez.</p><button class="btn btn-primary-light" data-action="open-import">+ &nbsp;Ajouter une recette <span>↗</span></button></div><div class="hero-art" aria-hidden="true"><div class="hero-platter"><span class="hero-food">🥙</span></div><span class="hero-spark one">✳</span><span class="hero-spark two">✦</span></div></section><section class="stats"><div class="stat-card"><div class="stat-ico">▤</div><div><strong class="stat-num">${total}</strong><small class="stat-caption">Mes recettes</small></div></div><div class="stat-card"><div class="stat-ico">♡</div><div><strong class="stat-num">${favorites}</strong><small class="stat-caption">Mes favoris</small></div></div><div class="stat-card"><div class="stat-ico">▦</div><div><strong class="stat-num">${planned}</strong><small class="stat-caption">Repas du jour</small></div></div></section><section><div class="section-heading"><h2>Ajoutées récemment <span style="color:#85a58a">✳</span></h2><button class="section-link" data-nav="recipes">Toutes mes recettes →</button></div><div class="recipe-grid">${top.map(card).join('')}</div></section><div class="home-bottom"><section class="flat-panel"><div class="panel-header"><h3>Cette semaine</h3><button class="section-link" data-nav="planner">Voir le planning →</button></div><div class="week-chips">${chips}</div><div id="home-day-meals">${renderDayMeals(t)}</div></section><section class="flat-panel"><div class="panel-header"><h3>Cooknote, c'est simple</h3><span class="eyebrow">01 — 03</span></div><div class="how-grid"><div class="how-item"><span class="how-icon">↗</span><div><strong>Capturez vos idées</strong><p>Depuis un lien, un texte ou votre clavier.</p></div></div><div class="how-item"><span class="how-icon">▤</span><div><strong>Retrouvez vos recettes</strong><p>Vos favoris et vos dossiers, bien rangés.</p></div></div><div class="how-item"><span class="how-icon">☷</span><div><strong>Planifiez & faites vos courses</strong><p>Une liste calculée depuis vos repas.</p></div></div></div></section></div>`;}
function renderDayMeals(day){return getMealsForDay(day).map(m=>{let r=m.slot&&recipeById(m.slot.recipeId);return `<div class="today-meal"><div><strong>${r?escapeHTML(r.title):'Aucun repas prévu'}</strong><small>${mealName(m.type)} · ${r?`${m.slot.servings||r.servings} personnes`:'À organiser'}</small></div><button class="circle-arrow" data-action="choose-meal" data-slot="${isoDate(day)}|${m.type}" aria-label="Choisir un repas">${r?'↗':'+'}</button></div>`;}).join('');}
function renderRecipes(){let filtered=filteredRecipes();return `${heading(activeFolder?escapeHTML(activeFolder):'Mes recettes',`${state.recipes.length} recettes sauvegardées et prêtes à cuisiner.`, 'Ajouter','open-import')}<div class="controls-row"><label class="search-box"><span>⌕</span><input id="recipe-search" placeholder="Rechercher une recette, un ingrédient..." value="${escapeHTML(recipeSearch)}" autocomplete="off" aria-label="Rechercher une recette"></label><div class="filter-chips"><button data-action="set-filter" data-filter="all" class="chip ${recipeFilter==='all'?'selected':''}">Toutes</button><button data-action="set-filter" data-filter="favorites" class="chip ${recipeFilter==='favorites'?'selected':''}">♡ Favoris</button><button data-action="set-filter" data-filter="fast" class="chip ${recipeFilter==='fast'?'selected':''}">◷ Rapides</button>${activeFolder?`<button class="chip selected" data-action="clear-folder">✕ ${escapeHTML(activeFolder)}</button>`:''}</div></div><div id="recipes-results">${filtered.length?`<div class="recipe-grid">${filtered.map(card).join('')}</div>`:empty('Aucune recette trouvée','Essayez une autre recherche ou ajoutez votre propre recette.')}</div>`;}
function filteredRecipes(){return state.recipes.filter(r=>{let search=normalized(recipeSearch), haystack=normalized([r.title,r.description,r.folder,...(r.ingredients||[]).map(i=>i.name)].join(' '));return (!search||haystack.includes(search))&&(!activeFolder||r.folder===activeFolder)&&(recipeFilter==='all'||recipeFilter==='favorites'&&r.favorite||recipeFilter==='fast'&&r.minutes>0&&r.minutes<=25);}).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}
function renderPlanner(){const end=addDays(currentWeek,6), label=`${dateFR(currentWeek,{day:'numeric',month:'short'})} – ${dateFR(end,{day:'numeric',month:'short',year:'numeric'})}`;let days=Array.from({length:7},(_,i)=>{let date=addDays(currentWeek,i),dateKey=isoDate(date);let slots=['lunch','dinner'].map(type=>{let slot=state.plan[`${dateKey}|${type}`],r=slot?recipeById(slot.recipeId):null;return `<div class="meal-slot ${r?'filled':''}" role="button" tabindex="0" data-action="choose-meal" data-slot="${dateKey}|${type}"><small>${mealName(type)}</small>${r?`<strong>${escapeHTML(r.emoji||'🍽️')} ${escapeHTML(r.title)}</strong><button class="remove-slot" data-action="remove-meal" data-slot="${dateKey}|${type}" aria-label="Retirer ce repas">×</button>`:'<span class="slot-plus">+</span>'}</div>`}).join('');return `<div class="planner-day ${dateKey===isoDate(new Date())?'today':''}"><div class="day-stamp"><small>${DAYS[date.getDay()].slice(0,3)}</small><strong>${date.getDate()}</strong></div><div class="day-meals">${slots}</div></div>`}).join('');let slots=weekSlots();let calories=slots.reduce((sum,s)=>{let r=recipeById(s.recipeId);return sum+(r?.calories||0)*(s.servings||r?.servings||1);},0),withCal=slots.filter(s=>recipeById(s.recipeId)?.calories).length;return `${heading('Mon planning','Une semaine sereine, repas après repas.')}<div class="planner-controls"><button class="square-btn" data-action="prev-week" aria-label="Semaine précédente">‹</button><span class="week-title">${label}</span><button class="square-btn" data-action="next-week" aria-label="Semaine suivante">›</button><button class="chip" data-action="current-week">Aujourd'hui</button></div><div class="planner-layout"><div class="planner-days">${days}</div><aside class="planner-side"><div class="flat-panel"><h3>Votre semaine ✳</h3><div class="calorie-num">${slots.length} <span style="font-size:13px;font-weight:700;letter-spacing:0">repas</span></div><div class="progress-rail"><div class="progress-fill" style="width:${slots.length/14*100}%"></div></div><p class="info-note">${slots.length} repas planifiés sur 14 créneaux disponibles.</p><div style="border-top:1px solid var(--line);margin:20px 0"></div><h3>Repères nutritionnels</h3><div class="calorie-num">${calories?Math.round(calories).toLocaleString('fr-FR'):'—'} <span style="font-size:12px;font-weight:700;letter-spacing:0">kcal</span></div><p class="info-note">Total estimé pour ${withCal} repas avec nutrition renseignée, selon les portions. Les autres ne sont pas comptés.</p><button class="btn side-btn" data-action="generate-groceries">☷ Générer mes courses</button></div></aside></div>`;}
function renderGroceries(){let total=state.groceries.length,done=state.groceries.filter(i=>i.done).length;let groups=CATEGORY_ORDER.map(cat=>({cat,items:state.groceries.filter(i=>i.category===cat)})).filter(g=>g.items.length);return `${heading('Liste de courses','Tout ce qu’il vous faut, trié par rayon.')}<div class="grocery-toolbar"><div class="filter-chips"><button class="btn btn-secondary btn-small" data-action="add-item">+ Ajouter un produit</button><button class="btn btn-secondary btn-small" data-action="generate-groceries">↻ Depuis mon planning</button></div>${done?'<button class="section-link" data-action="remove-checked">Supprimer les cochés</button>':''}</div><div class="grocery-progress"><div><strong>Votre panier avance 🌿</strong><small>${done} sur ${total} produits cochés</small></div><div class="progress-bubble">${total?Math.round(done/total*100):0}%</div></div>${groups.length?`<div class="grocery-groups">${groups.map(g=>`<section class="grocery-group"><div class="grocery-group-header"><span>${CATEGORY_ICONS[g.cat]}</span><strong>${escapeHTML(g.cat)}</strong><small>${g.items.length} produit${g.items.length>1?'s':''}</small></div>${g.items.map(i=>`<label class="grocery-item ${i.done?'done':''}"><input type="checkbox" data-action="check-item" data-id="${escapeHTML(i.id)}" ${i.done?'checked':''}><span class="item-name">${escapeHTML(i.name)}</span><span class="qty">${escapeHTML(formatAmount(i))}</span>${i.source==='manual'?`<button class="del-mini" data-action="delete-item" data-id="${escapeHTML(i.id)}" title="Supprimer" aria-label="Supprimer le produit">×</button>`:''}</label>`).join('')}</section>`).join('')}</div>`:empty('Votre panier est encore vide','Ajoutez un produit ou générez la liste depuis vos repas de la semaine.','Générer depuis le planning','generate-groceries')}`;}
function renderFolders(){return `${heading('Mes dossiers','Organisez vos idées gourmandes selon vos envies.','Nouveau dossier','add-folder')}<div class="folder-grid">${state.folders.map((name,i)=>`<button class="folder-card" data-action="open-folder" data-folder="${escapeHTML(name)}"><span class="folder-icon">${['🍃','🥘','☀️','✳','🍴'][i%5]}</span><strong>${escapeHTML(name)}</strong><small>${state.recipes.filter(r=>r.folder===name).length} recette(s) →</small></button>`).join('')}</div>`;}
function renderSettings(){return `${heading('Paramètres','Votre espace de recettes, votre contrôle.')}<div class="setting-list"><div class="setting-row"><div><strong>Exporter mes données</strong><p>Téléchargez vos recettes, vos dossiers et votre planning en JSON.</p></div><button class="btn btn-secondary btn-small" data-action="export-data">Exporter ↓</button></div><div class="setting-row"><div><strong>Importer mes données</strong><p>Restaurez un fichier JSON préalablement exporté.</p></div><button class="btn btn-secondary btn-small" data-action="import-data">Importer ↑</button></div><div class="setting-row"><div><strong>Réinitialiser la démonstration</strong><p>Efface les changements locaux et recharge les recettes d'exemple.</p></div><button class="btn btn-danger btn-small" data-action="reset-data">Réinitialiser</button></div></div><div class="notice"><strong>À propos de cette démo</strong> — Cooknote est une reconstruction indépendante à vocation d’étude. Les recettes d’exemple sont fictives, les valeurs nutritionnelles sont illustratives et aucune extraction TikTok / Instagram, synchronisation cloud, facturation ou OCR n’est intégrée. Les liens sont enregistrés localement pour être complétés à la main. Vos données restent dans ce navigateur.</div>`;}
const LABELS={home:"Vue d'ensemble",recipes:'Mes recettes',planner:'Mon planning',groceries:'Liste de courses',folders:'Mes dossiers',settings:'Paramètres'};
function render(){document.getElementById('page').innerHTML=({home:renderHome,recipes:renderRecipes,planner:renderPlanner,groceries:renderGroceries,folders:renderFolders,settings:renderSettings}[route]||renderHome)();document.getElementById('topbar-section').textContent=LABELS[route];document.querySelectorAll('[data-nav]').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav===route));}
function nav(to){route=LABELS[to]?to:'home';if(route==='recipes'&&to==='recipes'&&!activeFolder){recipeFilter='all';}render();window.scrollTo({top:0,behavior:'instant'});}
function openModal(title,subtitle,body,{wide=false}={}){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}"><div class="modal-head"><div><h2>${title}</h2><p>${subtitle||''}</p></div><button class="close-modal" data-action="close-modal" aria-label="Fermer">×</button></div><div class="modal-body">${body}</div></div></div>`;document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';}
function toast(msg){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast">${escapeHTML(msg)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3500);}
function importFields({manual=false,photo=false}={}){return `<form id="add-recipe-form" data-mode="${photo?'photo':manual?'manual':'text'}"><div class="field"><label for="new-title">Titre de la recette ${manual||photo?'':'(optionnel)'}</label><input id="new-title" name="title" ${manual||photo?'required':''} placeholder="Ex. Lasagnes aux légumes"></div>${photo?'<div class="field"><label>Photo de couverture</label><input type="file" id="new-photo" accept="image/*" required><span class="field-hint">L’image est conservée dans votre navigateur, sans reconnaissance automatique du texte.</span></div>':''}<div class="field-grid"><div class="field"><label for="new-minutes">Préparation (min)</label><input id="new-minutes" name="minutes" type="number" min="0" max="1440" placeholder="30"></div><div class="field"><label for="new-servings">Nombre de portions</label><input id="new-servings" name="servings" type="number" min="1" max="100" value="2" required></div></div><div class="field"><label for="new-ingredients">Ingrédients (un par ligne)</label><textarea id="new-ingredients" name="ingredients" placeholder="200 g de pâtes\n2 tomates\n1 c. à soupe d'huile d'olive" ${manual||photo?'required':''}></textarea></div><div class="field"><label for="new-steps">Étapes (une par ligne)</label><textarea id="new-steps" name="steps" placeholder="Faire chauffer une poêle.\nAjouter les tomates.\nServir bien chaud."></textarea></div><div class="field"><label for="new-folder">Dossier</label><select id="new-folder" name="folder"><option value="">Sans dossier</option>${state.folders.map(f=>`<option value="${escapeHTML(f)}">${escapeHTML(f)}</option>`).join('')}</select></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-action="close-modal">Annuler</button><button type="submit" class="btn">Enregistrer la recette →</button></div></form>`;}
function renderImport(){const tabs=[['url','Un lien ↗'],['text','Un texte ▤'],['manual','Manuel ✎'],['photo','Photo ▧']];let body=`<div class="tabs">${tabs.map(([mode,title])=>`<button data-action="import-tab" data-mode="${mode}" class="${modalMode===mode?'active':''}">${title}</button>`).join('')}</div>`;if(modalMode==='url')body+=`<form id="add-url-form"><div class="field"><label for="import-url">Lien vers une recette</label><input type="url" id="import-url" name="url" required placeholder="https://www.tiktok.com/@... ou site de cuisine"><span class="field-hint">TikTok, Instagram, YouTube ou site de recettes. La démo sauvegarde le lien sans analyser la plateforme : l’extraction automatique demande un serveur ou une API.</span></div><div class="inline-callout">✳ Le lien sera enregistré comme fiche « à compléter ». Pour une vraie extraction locale, utilisez l’onglet Texte.</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-action="close-modal">Annuler</button><button type="submit" class="btn">Sauvegarder le lien →</button></div></form>`;if(modalMode==='text')body+=`<form id="parse-text-form"><div class="field"><label for="raw-recipe">Collez une recette complète</label><textarea id="raw-recipe" name="raw" style="min-height:205px" required placeholder="Pâtes à la tomate\nPour 2 personnes\nIngrédients :\n200 g de pâtes\n3 tomates\n2 c. à soupe d’huile d’olive\nPréparation :\n1. Cuire les pâtes.\n2. Faire revenir les tomates.\n3. Mélanger et servir."></textarea><span class="field-hint">Analyse locale heuristique : elle repère les titres, ingrédients, quantités et étapes. Vous pourrez ensuite les modifier.</span></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-action="close-modal">Annuler</button><button type="submit" class="btn">Analyser le texte →</button></div></form>`;if(modalMode==='manual')body+=importFields({manual:true});if(modalMode==='photo')body+=importFields({photo:true});openModal('Ajouter une recette','Votre prochaine découverte n’attend que vous.',body);}
function parseIngredient(line){let source=String(line).replace(/^[-•*]\s*/,'').trim();source=source.replace(/^(\d+)\s*[.)]\s*/,'$1 ');let m=source.match(/^(\d+(?:[.,]\d+)?|½|¼|¾)\s*(kg|g|ml|cl|l|c\.\s*à\s*soupe|cuillères?\s*à\s*soupe|c\.\s*à\s*café|cuillères?\s*à\s*café|gousses?|tranches?|poignées?|boîtes?|pincées?|tasses?)?\s*(?:d['’e]?\s*|de\s+|du\s+|des\s+)?(.+)$/i);if(!m)return ingredient(null,'',source,guessCategory(source));let qty={'½':.5,'¼':.25,'¾':.75}[m[1]]??Number(m[1].replace(',','.'));let unit=m[2]||'',name=m[3].trim();return ingredient(qty,unit,name,guessCategory(name));}
function parseRecipeText(raw){let lines=String(raw).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let title=lines[0]||'Nouvelle recette',section='head',ingredients=[],steps=[],portions=2,minutes=0;for(let i=1;i<lines.length;i++){let l=lines[i],norm=normalized(l);let headIng=/^ingredients\s*:?$/.test(norm),headSteps=/^(preparation|etapes?|instructions|recette|methode)\s*:?$/.test(norm);if(headIng){section='ingredients';continue;}if(headSteps){section='steps';continue;}let pm=norm.match(/(?:pour\s*)?(\d+)\s*(?:pers(?:onnes?)?|portions?|servings?)/);if(pm&&section==='head'){portions=Number(pm[1]);continue;}let tm=norm.match(/(?:temps|preparation|cuisson|total)\s*:?\s*(\d+)\s*(?:min|minutes)/);if(tm&&section==='head'){minutes=Number(tm[1]);continue;}if(section==='ingredients'){ingredients.push(parseIngredient(l));continue;}if(section==='steps'){steps.push(l.replace(/^\d+[.)]\s*/,''));continue;}if(/^[-•*]\s*\d/.test(l)||/^\d+\s*(?:g|kg|ml|cl|l|\b[a-z]+\b)/i.test(l)&&/\s/.test(l)){section='ingredients';ingredients.push(parseIngredient(l));}else if(/^\d+[.)]\s/.test(l)){section='steps';steps.push(l.replace(/^\d+[.)]\s*/,''));}else if(i===1&&!minutes){title=lines[0];}}
if(!ingredients.length&&!steps.length){let numbered=lines.slice(1).filter(l=>/^\d+[.)]\s/.test(l));let others=lines.slice(1).filter(l=>!/^\d+[.)]\s/.test(l));ingredients=others.map(parseIngredient);steps=numbered.map(x=>x.replace(/^\d+[.)]\s*/,''));}
return {title,servings:portions,minutes,ingredients,steps};}
function newRecipe(payload){let now=new Date().toISOString();return {id:uid(),title:String(payload.title||'Nouvelle recette').slice(0,160),description:payload.description||'Votre recette personnelle, sauvegardée dans Cooknote.',emoji:payload.emoji||'🍽️',color:COLORS[state.recipes.length%COLORS.length],minutes:Number(payload.minutes)||0,servings:Math.max(1,Number(payload.servings)||2),ingredients:payload.ingredients||[],steps:payload.steps||[],folder:payload.folder||'',tags:[],favorite:false,calories:null,macros:null,createdAt:now,source:payload.source||'Ajout personnel',sourceUrl:payload.sourceUrl||null,pending:!!payload.pending,photo:payload.photo||null};}
function addRecipe(r){state.recipes.unshift(r);save();closeModal();nav('recipes');toast('Recette sauvegardée dans votre bibliothèque');}
function makeTitleFromURL(url){try{let u=new URL(url),words=u.pathname.split('/').filter(Boolean).pop()||u.hostname.replace(/^www\./,'');let text=decodeURIComponent(words).replace(/[-_]+/g,' ').replace(/\d{8,}/g,'').trim();if(text.length<4||text.toLowerCase()==='photo'||text.toLowerCase()==='video')text='Recette à compléter';return text[0].toUpperCase()+text.slice(1);}catch(e){return 'Recette à compléter';}}
function openDetail(id){let r=recipeById(id);if(!r)return;detailServings=r.servings;checkedIngredients=new Set();renderDetail();}
function renderDetail(){let r=recipeById(currentDetailId);if(!r)return;let ratio=detailServings/r.servings;let body=`<div class="detail-top">${art(r,true)}<div class="detail-intro"><div class="eyebrow">${r.pending?'RECETTE À COMPLÉTER':escapeHTML(r.folder||'DANS VOTRE BIBLIOTHÈQUE')}</div><h3>${escapeHTML(r.title)}</h3><p>${escapeHTML(r.description)}</p><div class="detail-metrics"><div class="metric"><strong>${r.minutes?`${r.minutes} min`:'—'}</strong><small>Temps total</small></div><div class="metric"><strong>${detailServings}</strong><small>Portions</small></div><div class="metric"><strong>${r.calories?`${r.calories} kcal`:'—'}</strong><small>Par portion</small></div></div><div class="detail-actions"><button class="btn btn-small" data-action="plan-from-detail" data-id="${escapeHTML(r.id)}">+ Planifier</button><button class="btn btn-secondary btn-small" data-action="edit-recipe" data-id="${escapeHTML(r.id)}">✎ Modifier</button><button class="btn btn-secondary btn-small" data-action="favorite" data-id="${escapeHTML(r.id)}">${r.favorite?'♥ Favori':'♡ Favori'}</button></div>${r.sourceUrl?`<span class="recipe-source">Source : <a href="${escapeHTML(r.sourceUrl)}" target="_blank" rel="noopener noreferrer">Voir le lien d’origine ↗</a></span>`:''}</div></div><div class="detail-body"><section class="detail-section"><h4>Ingrédients</h4><div class="servings-bar"><span>Nombre de personnes</span><div class="stepper"><button data-action="servings-minus" aria-label="Réduire les portions">−</button><strong>${detailServings}</strong><button data-action="servings-plus" aria-label="Augmenter les portions">+</button></div></div>${(r.ingredients||[]).length?r.ingredients.map((ing,i)=>`<label class="ingredient-row ${checkedIngredients.has(i)?'checked':''}"><input type="checkbox" data-action="ingredient-check" data-index="${i}" ${checkedIngredients.has(i)?'checked':''}><span>${escapeHTML(ing.name)}</span><b>${escapeHTML(formatAmount(ing,ratio))}</b></label>`).join(''):'<p class="info-note">Aucun ingrédient enregistré. Cliquez sur « Modifier » pour compléter cette recette.</p>'}<div class="nutrition"><strong>Valeurs par portion ${r.calories?'(estimations de démonstration)':''}</strong>${r.calories?`<div class="macro-row"><span>Énergie <b>${r.calories} kcal</b></span><span>Protéines <b>${r.macros?.protein||0} g</b></span><span>Glucides <b>${r.macros?.carbs||0} g</b></span><span>Lipides <b>${r.macros?.fats||0} g</b></span></div>`:'<p class="info-note">Non renseignées pour cette recette. Aucune valeur n’est inventée.</p>'}</div></section><section class="detail-section"><h4>Préparation</h4>${(r.steps||[]).length?r.steps.map((s,i)=>`<div class="step"><span class="step-number">${i+1}</span><p>${escapeHTML(s)}</p></div>`).join(''):'<p class="info-note">Aucune étape enregistrée. Ajoutez les instructions pour pouvoir cuisiner.</p>'}<button class="btn btn-secondary btn-small" data-action="add-detail-shopping" data-id="${escapeHTML(r.id)}">☷ Ajouter les ingrédients aux courses</button></section></div>`;openModal('Fiche recette','Une cuisine simple, sans distraction.',body,{wide:true});}

function openRecipePicker(slot,selectedId=''){plannerSlot=slot;let [date,type]=slot.split('|');const rows=state.recipes.map(r=>`<button class="picker-item" data-action="pick-recipe" data-id="${escapeHTML(r.id)}"><span class="picker-art">${escapeHTML(r.emoji||'🍽️')}</span><span><strong>${escapeHTML(r.title)}</strong><small>${r.minutes?`${r.minutes} min · `:''}${r.servings} personnes${r.pending?' · À compléter':''}</small></span></button>`).join('');openModal('Choisir une recette',`${mealName(type)} du ${dateFR(fromISO(date),{weekday:'long',day:'numeric',month:'long'})}`,`<div class="list-picker">${rows||'<p class="info-note">Ajoutez d’abord une recette dans votre bibliothèque.</p>'}</div>`);}

function openPlanRecipe(id){let r=recipeById(id);if(!r)return;openModal('Planifier cette recette',`Choisissez quand cuisiner « ${escapeHTML(r.title)} ».`, `<form id="plan-recipe-form" data-id="${escapeHTML(r.id)}"><div class="field"><label>Date du repas</label><input type="date" name="date" required value="${isoDate(new Date())}"></div><div class="field-grid"><div class="field"><label>Repas</label><select name="type"><option value="lunch">Déjeuner</option><option value="dinner" selected>Dîner</option></select></div><div class="field"><label>Portions</label><input name="servings" type="number" min="1" max="100" value="${detailServings||r.servings}" required></div></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-action="close-modal">Annuler</button><button class="btn" type="submit">Ajouter au planning →</button></div></form>`);}
function addShoppingFromRecipe(id,servings){let r=recipeById(id);if(!r)return;let old=new Map(state.groceries.map(i=>[i.id,i]));let ratio=servings/r.servings;for(let ing of r.ingredients){let key=`manual-${uid()}`;state.groceries.push({id:key,name:ing.name,qty:(Number(ing.qty)||0)*ratio,unit:ing.unit,category:ing.category||guessCategory(ing.name),done:false,source:'manual'});}save();closeModal();nav('groceries');toast('Ingrédients ajoutés à votre panier');}
function parseLines(s){return String(s||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);}
function handleRecipeForm(form){let fd=new FormData(form);let title=String(fd.get('title')||'').trim();let ingredients=parseLines(fd.get('ingredients')).map(parseIngredient);let steps=parseLines(fd.get('steps')).map(t=>t.replace(/^\d+[.)]\s*/,''));let record=newRecipe({title,minutes:fd.get('minutes'),servings:fd.get('servings'),folder:fd.get('folder'),ingredients,steps});if(form.dataset.mode==='photo'){let input=form.querySelector('#new-photo');if(!input.files?.length){toast('Choisissez une photo');return;}const file=input.files[0];if(file.size>12*1024*1024){toast('Photo trop volumineuse (12 Mo max)');return;}let reader=new FileReader();reader.onerror=()=>toast('La photo n’a pas pu être lue');reader.onload=()=>{let image=new Image();image.onerror=()=>toast('Format d’image illisible');image.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,900/Math.max(image.width,image.height));canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);record.photo=canvas.toDataURL('image/jpeg',.72);addRecipe(record);};image.src=reader.result;};reader.readAsDataURL(file);return;}addRecipe(record);}
function openEditRecipe(id){let r=recipeById(id);if(!r)return;let body=`<form id="edit-recipe-form" data-id="${escapeHTML(id)}"><div class="field"><label>Titre</label><input name="title" required value="${escapeHTML(r.title)}"></div><div class="field-grid"><div class="field"><label>Minutes</label><input name="minutes" type="number" min="0" max="1440" value="${r.minutes||0}"></div><div class="field"><label>Portions</label><input name="servings" type="number" min="1" max="100" required value="${r.servings}"></div></div><div class="field"><label>Ingrédients (un par ligne)</label><textarea name="ingredients">${escapeHTML((r.ingredients||[]).map(i=>`${formatAmount(i)} ${i.name}`.trim()).join('\n'))}</textarea></div><div class="field"><label>Étapes (une par ligne)</label><textarea name="steps">${escapeHTML((r.steps||[]).join('\n'))}</textarea></div><div class="field"><label>Dossier</label><select name="folder"><option value="">Sans dossier</option>${state.folders.map(f=>`<option ${r.folder===f?'selected':''} value="${escapeHTML(f)}">${escapeHTML(f)}</option>`).join('')}</select></div><div class="modal-footer" style="justify-content:space-between"><button type="button" class="btn btn-danger btn-small" data-action="delete-recipe" data-id="${escapeHTML(id)}">Supprimer</button><button class="btn" type="submit">Enregistrer les changements</button></div></form>`;openModal('Modifier ma recette','Vos ingrédients et étapes restent modifiables.',body);}

function exportData(){let blob=new Blob([JSON.stringify({app:'cooknote-demo',version:2,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`cooknote-sauvegarde-${isoDate(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Sauvegarde exportée');}
function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let file=input.files?.[0];if(!file)return;if(file.size>15*1024*1024){toast('Fichier trop volumineux');return;}let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result),data=parsed.data||parsed;if(!Array.isArray(data.recipes)||!Array.isArray(data.folders)||!data.plan||!Array.isArray(data.groceries))throw Error('Format incorrect');if(data.recipes.length>1500)throw Error('Trop de recettes');state=data;save();activeFolder='';recipeSearch='';recipeFilter='all';nav('home');toast('Données restaurées');}catch(e){toast('Fichier JSON invalide ou incompatible');}};reader.readAsText(file);};input.click();}

document.addEventListener('click',event=>{let el=event.target.closest('[data-action],[data-nav]');if(!el)return;if(el.dataset.nav){event.preventDefault();if(document.querySelector('.modal'))closeModal();if(el.dataset.nav==='recipes'&&route!=='recipes')activeFolder='';nav(el.dataset.nav);return;}let a=el.dataset.action,id=el.dataset.id;const isModalClick=!!event.target.closest('.modal');if(a==='backdrop'){if(!isModalClick)closeModal();return;}if(a==='favorite'){event.stopPropagation();let r=recipeById(id);if(r){r.favorite=!r.favorite;save();if(currentDetailId===id&&isModalClick)renderDetail();else render();toast(r.favorite?'Ajouté aux favoris':'Retiré des favoris');}return;}if(a==='ingredient-check')return;switch(a){case 'open-import':modalMode='url';renderImport();break;case 'open-more':openModal('Toutes les rubriques','Accès rapide à votre espace.',`<div class="list-picker"><button class="picker-item" data-nav="folders"><span class="picker-art">▧</span><span><strong>Mes dossiers</strong><small>Retrouver et organiser les recettes</small></span></button><button class="picker-item" data-nav="settings"><span class="picker-art">⚙</span><span><strong>Paramètres</strong><small>Exporter, importer ou réinitialiser vos données</small></span></button></div>`);break;case 'close-modal':closeModal();break;case 'import-tab':modalMode=el.dataset.mode;renderImport();break;case 'detail':openRecipeAndTrack(id);break;case 'set-filter':recipeFilter=el.dataset.filter;render();break;case 'clear-folder':activeFolder='';render();break;case 'open-folder':activeFolder=el.dataset.folder;recipeFilter='all';recipeSearch='';nav('recipes');break;case 'add-folder':addFolderModal();break;case 'add-item':addGroceryModal();break;case 'delete-item':state.groceries=state.groceries.filter(item=>item.id!==id);save();render();break;case 'remove-checked':state.groceries=state.groceries.filter(item=>!item.done);save();render();break;case 'generate-groceries':generateAndNav();break;case 'prev-week':currentWeek=addDays(currentWeek,-7);render();break;case 'next-week':currentWeek=addDays(currentWeek,7);render();break;case 'current-week':currentWeek=startWeek(new Date());render();break;case 'choose-meal':chooseMeal(el.dataset.slot);break;case 'remove-meal':event.stopPropagation();delete state.plan[el.dataset.slot];save();render();break;case 'pick-recipe':state.plan[plannerSlot]={recipeId:id,servings:recipeById(id)?.servings||2};save();closeModal();nav('planner');toast('Repas ajouté au planning');break;case 'home-day':{document.querySelectorAll('.week-chip').forEach(b=>b.classList.toggle('selected',b===el));let day=fromISO(el.dataset.date);document.getElementById('home-day-meals').innerHTML=renderDayMeals(day);break;}case 'servings-plus':detailServings=Math.min(100,detailServings+1);renderDetail();break;case 'servings-minus':detailServings=Math.max(1,detailServings-1);renderDetail();break;case 'plan-from-detail':openPlanRecipe(id);break;case 'edit-recipe':openEditRecipe(id);break;case 'add-detail-shopping':addShoppingFromRecipe(id,detailServings);break;case 'delete-recipe':{let r=recipeById(id);if(!r||!confirm(`Supprimer définitivement « ${r.title} » ?`))break;state.recipes=state.recipes.filter(x=>x.id!==id);Object.keys(state.plan).forEach(k=>{if(state.plan[k].recipeId===id)delete state.plan[k];});save();closeModal();nav('recipes');toast('Recette supprimée');break;}case 'export-data':exportData();break;case 'import-data':importData();break;case 'reset-data':showResetConfirm();break;case 'confirm-reset':state=seedState();save();closeModal();activeFolder='';currentWeek=startWeek(new Date());nav('home');toast('Démonstration réinitialisée');break;}});
document.addEventListener('input',event=>{if(event.target.id==='recipe-search'){recipeSearch=event.target.value;let results=document.getElementById('recipes-results');if(results){let recipes=filteredRecipes();results.innerHTML=recipes.length?`<div class="recipe-grid">${recipes.map(card).join('')}</div>`:empty('Aucune recette trouvée','Essayez une autre recherche ou ajoutez votre propre recette.');}}});

// Explicitly check current media state before waiting; this avoids lost
// loadeddata/seeked events when the browser resolves the seek synchronously.
function bv4VideoWait(video, event, ms=15000, done=()=>false){
  if(done()) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    let timer;
    const cleanup=()=>{clearTimeout(timer);video.removeEventListener(event,onEvent);video.removeEventListener('error',onError)};
    const onEvent=()=>{cleanup();resolve()};
    const onError=()=>{cleanup();reject(Error('Format vidéo non décodable. Convertissez-le en MP4 H.264 ou WebM.'))};
    video.addEventListener(event,onEvent,{once:true});video.addEventListener('error',onError,{once:true});
    if(done()){onEvent();return;}
    timer=setTimeout(()=>{cleanup();reject(Error('La lecture de la vidéo a dépassé le délai (codec incompatible ou fichier endommagé).'));},ms);
  });
}
async function bv4ReadFrames(file){
  const url=URL.createObjectURL(file),video=document.createElement('video');
  video.muted=true;video.preload='auto';video.playsInline=true;video.src=url;
  const texts=[];
  try {
    await bv4VideoWait(video,'loadedmetadata',20000,()=>video.readyState>=1);
    const duration=Number.isFinite(video.duration)?video.duration:0;
    const width=Math.min(1300,video.videoWidth||0),height=width?Math.round((video.videoHeight||0)*width/(video.videoWidth||1)):0;
    if(!width||!height)throw Error('Images vidéo non disponibles : essayez une vidéo MP4 H.264.');
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
    if(!ctx)throw Error('Canvas indisponible.');
    canvas.width=width;canvas.height=height;
    // Short clips: sample several distinct screens, skipping the title card.
    const positions=duration>1?[.05,.17,.34,.50,.68,.85,.96].map(x=>Math.min(Math.max(.01,duration*x),Math.max(0,duration-.04))):[0];
    const unique=[...new Set(positions.map(x=>x.toFixed(2)))].map(Number);
    const errors=[];
    for(let i=0;i<unique.length;i++) {
      bv4Status(`Analyse des images : ${i+1}/${unique.length}…`);
      const target=unique[i];
      try {
        if(Math.abs(video.currentTime-target)>.05){
          const onSeek=bv4VideoWait(video,'seeked',16000,()=>!video.seeking&&Math.abs(video.currentTime-target)<.05&&video.readyState>=2);
          video.currentTime=target;
          await onSeek;
        }
        if(video.readyState<2)await bv4VideoWait(video,'loadeddata',16000,()=>video.readyState>=2);
        ctx.drawImage(video,0,0,width,height);
        const found=(await bv4Scan(canvas)).trim();if(found)texts.push(found);
      }catch(e){errors.push('Image '+(i+1)+' : '+e.message);}
    }
    if(!texts.length&&errors.length)throw Error(errors.slice(0,2).join(' · '));
    return {texts,duration,warnings:errors};
  } finally {video.removeAttribute('src');video.load();URL.revokeObjectURL(url);}
}

let bv4Transcriber=null;
async function bv4GetTranscriber(){
 if(bv4Transcriber)return bv4Transcriber;
 bv4Status('Téléchargement de Whisper et des modèles : cela peut être volumineux…');
 const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm');
 env.allowLocalModels=false;
 bv4Transcriber=await pipeline('automatic-speech-recognition','onnx-community/whisper-tiny',{device:'wasm',dtype:'q8',progress_callback:e=>{
    if(e.status==='progress'&&e.progress!=null)bv4Status('Téléchargement du modèle vocal : '+Math.round(e.progress)+' %');
 }});
 return bv4Transcriber;
}
async function bv4DecodeAudio(file){
 const ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
 try{
 const raw=await file.arrayBuffer();
 const decoded=await ctx.decodeAudioData(raw.slice(0));
 const maxSamples=Math.min(decoded.length,Math.round(decoded.sampleRate*180));
 const source=new Float32Array(maxSamples);
 for(let ch=0;ch<decoded.numberOfChannels;ch++) {const data=decoded.getChannelData(ch);for(let i=0;i<maxSamples;i++)source[i]+=data[i]/decoded.numberOfChannels;}
 if(decoded.sampleRate===16000)return source;
 const ratio=decoded.sampleRate/16000, count=Math.floor(source.length/ratio),result=new Float32Array(count);
 for(let i=0;i<count;i++){const p=i*ratio,a=Math.floor(p),b=Math.min(a+1,source.length-1),t=p-a;result[i]=source[a]*(1-t)+source[b]*t;}
 return result;
 }finally{await ctx.close();}
}
// Capture local video audio using built-in HTMLMediaElement + MediaRecorder.
// This is compatible with MP4 files that WebAudio's decodeAudioData rejects.
async function bv4AudioFromVideo(file){
  if(typeof MediaRecorder==='undefined')throw Error('Ce navigateur ne fournit pas MediaRecorder. Essayez Chrome ou Edge.');
  const url=URL.createObjectURL(file),video=document.createElement('video');
  video.src=url;video.preload='auto';video.playsInline=true;video.muted=true;
  let rec=null,stream=null;
  try{
    await bv4VideoWait(video,'loadedmetadata',18000,()=>video.readyState>=1);
    const capture=video.captureStream||video.mozCaptureStream;
    if(typeof capture!=='function')throw Error('Capture audio de vidéo non prise en charge par ce navigateur.');
    bv4Status('Lecture de la piste audio en temps réel (jusqu’à 90 s)…');
    try{await video.play();}catch(e){throw Error('Lecture vidéo bloquée : '+e.message);}
    stream=capture.call(video);
    let tracks=stream.getAudioTracks();
    for(let i=0;i<12&&!tracks.length;i++){
      await new Promise(resolve=>setTimeout(resolve,250));tracks=stream.getAudioTracks();
    }
    if(!tracks.length)throw Error('Aucune piste audio détectée dans cette vidéo.');
    const audioStream=new MediaStream(tracks);
    const type=['audio/webm;codecs=opus','audio/webm','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));
    if(!type)throw Error('Format MediaRecorder non compatible.');
    const chunks=[];
    const done=new Promise((resolve,reject)=>{
      rec=new MediaRecorder(audioStream,{mimeType:type});
      rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      rec.onerror=e=>reject(Error('Enregistrement audio : '+(e.error?.message||'erreur inconnue')));
      rec.onstop=resolve;
      rec.start(1000);
    });
    const limit=Math.min(Number.isFinite(video.duration)&&video.duration>0?video.duration*1000+800:91000,91000);
    await Promise.race([
      new Promise(resolve=>video.addEventListener('ended',resolve,{once:true})),
      new Promise(resolve=>setTimeout(resolve,limit)),
    ]);
    if(rec.state!=='inactive')rec.stop();await done;
    const recording=new File(chunks,'audio.webm',{type:chunks[0]?.type||type});
    if(!recording.size)throw Error('Aucun audio capturé.');
    return await bv4DecodeAudio(recording);
  } finally {
    if(rec?.state==='recording')rec.stop();
    if(stream)stream.getTracks().forEach(t=>t.stop());
    video.pause();video.removeAttribute('src');video.load();URL.revokeObjectURL(url);
  }
}

async function bv4Transcribe(file){
 let audio;
 try {bv4Status('Lecture de la piste audio…');audio=await bv4DecodeAudio(file);}
 catch(err){if(!file.type.startsWith('video/')&&!/\.(mp4|mov|webm)$/i.test(file.name))throw Error('Audio non pris en charge : '+err.message);audio=await bv4AudioFromVideo(file);}
 if(!audio||audio.length<16000)throw Error('Aucune piste audio exploitable');
 const transcriber=await bv4GetTranscriber();bv4Status('Whisper transcrit la parole sur cet appareil…');
 const output=await transcriber(audio,{task:'transcribe',language:'french',chunk_length_s:25,stride_length_s:4});
 return String(output?.text||'').trim();
}
async function bv4ImportMedia(form){
 if(browserBusy)return;
 const file=form.querySelector('[name="media"]')?.files?.[0]||null;
 const options=new FormData(form),doOCR=options.has('doOCR'),doASR=options.has('doASR');
 const notes=String(options.get('notes')||'').trim();
 let sourceUrl=String(options.get('sourceUrl')||browserPendingSourceURL||'').trim();
 if(sourceUrl){try{sourceUrl=bv4NormalizeSource(sourceUrl);}catch{bv4Status('L’URL source est invalide.','error');return;}}
 if(!file&&!notes){bv4Status('Choisissez un fichier vidéo/audio ou collez la transcription du Reel.','warning');return;}
 if(file?.size>100*1024*1024){bv4Status('Fichier supérieur à 100 Mo.','error');return;}
 if(file&&!doOCR&&!doASR&&!notes){bv4Status('Cochez une analyse ou collez une transcription.','warning');return;}
 const button=form.querySelector('button[type="submit"]');button.disabled=true;browserBusy=true;
 const textChunks=[],warnings=[],ocrChunks=[];let duration=0,audioText='';
 try{
  const isVideo=bv4IsVideoFile(file);
  if(file&&isVideo&&doOCR){
    try{const result=await bv4ReadFrames(file);ocrChunks.push(...result.texts);duration=result.duration;if(result.warnings?.length)warnings.push(...result.warnings.slice(0,2));}
    catch(e){warnings.push('Images : '+e.message);}
  }
  if(file&&doASR){
    try{audioText=await bv4Transcribe(file);if(audioText)textChunks.push(audioText);else warnings.push('Transcription vide (aucune parole reconnue).');}
    catch(e){warnings.push('Voix : '+e.message);}
  }
  if(notes)textChunks.push(notes);
  const raw=[...ocrChunks,...textChunks].filter(Boolean).join('\n');
  if(!raw.trim()){
    bv4Status('Aucun texte exploitable. '+warnings.join(' · ')+'. Ajoutez la transcription ou une capture d’écran dans le formulaire.','warning');return;
  }
  const parsed=bv4RecipeFromText(raw,file?.name||'Recette Instagram');
  const methods=[ocrChunks.length?'OCR vidéo':'',audioText?'Transcription voix':'',notes?'Légende / transcription':''].filter(Boolean).join(' + ');
  bv4Review(parsed,{method:methods||'Texte importé',sourceUrl,raw,message:(warnings.length?warnings.slice(0,3).join(' · ')+'. ':'')+`Analyse de ${ocrChunks.length} image(s)${duration?' d’une vidéo de '+Math.round(duration)+' s':''}. Relisez la recette avant sauvegarde.`});
  browserPendingSourceURL='';
 }catch(e){bv4Status('Analyse impossible : '+e.message,'error');}
 finally{browserBusy=false;if(button.isConnected)button.disabled=false;}
}

function bv4SchemaRecipe(data){return v2SchemaRecipe(data);}
async function bv4ImportURL(form){
 const url=String(new FormData(form).get('url')||'').trim();let parsed;
 try{parsed=new URL(url);if(!['https:','http:'].includes(parsed.protocol))throw Error();}catch{bv4Status('URL invalide','error','bv4-url-status');return;}
 const host=parsed.hostname.replace(/^www\./i,'');
 if(browserSocialHosts.test(host)){
  const clean=bv4NormalizeSource(url);
  browserPendingSourceURL=clean;
  const preview=/instagram\.com$/i.test(host)&&/\/(?:reel|p|tv)\/([A-Za-z0-9_-]+)/.test(parsed.pathname)?
     `https://www.instagram.com/reel/${RegExp.$1}/embed/` :
     /youtu\.be$|youtube\.com$/i.test(host)?(() => {const id=parsed.searchParams.get('v')||(host==='youtu.be'?parsed.pathname.split('/')[1]:parsed.pathname.match(/\/shorts\/([\w-]+)/)?.[1]);return id?`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}`:''})():'';
  const body=`<div class="bv4-feature"><span class="bv4-symbol">▶</span><div><strong>Vidéo liée à la recette</strong><p>L’accès direct à l’audio et aux images du Reel est interdit aux pages HTML par la plateforme. Vous pouvez néanmoins l’ouvrir et importer son contenu dans Cooknote.</p></div></div>
     ${preview?`<details class="bv4-manual"><summary>Prévisualiser le lien (chargement depuis la plateforme)</summary><iframe class="bv4-embed" title="Prévisualisation de la vidéo" loading="lazy" src="${escapeHTML(preview)}" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><p class="field-hint">La prévisualisation dépend de l’accès public et de l’autorisation d’intégration. Elle ne donne pas accès aux images à analyser.</p></details>`:''}
     <div class="bv4-tip">Source : <a href="${escapeHTML(clean)}" target="_blank" rel="noopener noreferrer">${escapeHTML(clean)}</a></div>
     <p class="bv4-review-note">Si vous disposez du fichier vidéo, importez-le pour lire le texte à l’écran et la voix. Sinon, collez la légende ou la transcription. Le lien sera enregistré avec la recette.</p>
     <div class="bv4-actionbar"><button class="btn" data-bv4-action="continue-video" type="button">Choisir une vidéo ou coller sa légende →</button><button class="btn btn-secondary" data-bv4-action="save-link" type="button">Sauvegarder le lien seul</button></div>`;
  openModal('Importer depuis un réseau social','Lien validé et conservé pour la recette.',body,{wide:true});
  return;
 }
 const button=form.querySelector('[type="submit"]');button.disabled=true;
 bv4Status('Lecture des données de recette publiques, si le site autorise CORS…','loading','bv4-url-status');
 try {
   const controller=new AbortController(),time=setTimeout(()=>controller.abort(),10000);
   let response;try{response=await fetch(url,{mode:'cors',credentials:'omit',signal:controller.signal});}finally{clearTimeout(time);}
   if(!response.ok)throw Error('HTTP '+response.status);
   const html=await response.text();if(html.length>browserFetchLimit)throw Error('Page trop volumineuse');
   const doc=new DOMParser().parseFromString(html,'text/html');let found=null;
   for(const script of doc.querySelectorAll('script[type="application/ld+json"]')){
     try{found=bv4SchemaRecipe(JSON.parse(script.textContent));if(found)break;}catch{}
   }
   if(!found)throw Error('Données Recipe (JSON-LD) absentes');
   const fields=Array.isArray(found.recipeIngredient)?found.recipeIngredient:[];
   const instructions=v2SchemaSteps(found.recipeInstructions);
   const yields=Array.isArray(found.recipeYield)?found.recipeYield[0]:found.recipeYield;
   const parsedRecipe={title:found.name||makeTitleFromURL(url),servings:Number(String(yields||'').match(/\d+/)?.[0])||2,minutes:v2Duration(found.totalTime)||v2Duration(found.prepTime)+v2Duration(found.cookTime),ingredients:fields,steps:instructions,description:found.description||''};
   bv4Review(parsedRecipe,{method:'Recette structurée · Site web',sourceUrl:url,raw:[...fields,...instructions].join('\n'),message:'Les données structurées du site ont pu être lues. Vérifiez leur contenu.'});
 }catch(e){bv4Status('Extraction bloquée : '+e.message+'. Vous pouvez conserver ce lien ou copier la recette dans « Un texte ».','warning','bv4-url-status');}
 finally{if(button.isConnected)button.disabled=false;}
}
v2ImportURL=bv4ImportURL;
document.addEventListener('click',e=>{
 const control=e.target.closest('[data-bv4-action]');if(!control)return;
 e.preventDefault();e.stopImmediatePropagation();
 if(control.dataset.bv4Action==='continue-video'){
   modalMode='media';renderImport();
 }
 if(control.dataset.bv4Action==='save-link'){
   const url=browserPendingSourceURL;if(!url)return;
   const host=new URL(url).hostname;
   addRecipe(newRecipe({title:makeTitleFromURL(url),sourceUrl:url,pending:true,source:`Lien ${host}`,description:'Source vidéo conservée. Ajoutez une vidéo locale, une légende ou une transcription pour extraire la recette.'}));
   browserPendingSourceURL='';toast('Lien enregistré sans extraction');
 }
},true);

document.addEventListener('submit',e=>{
 const form=e.target;
 if(form.id==='parse-text-form'){
  e.preventDefault();e.stopImmediatePropagation();
  const data=new FormData(form),raw=String(data.get('raw')||'').trim();
  if(!raw){toast('Collez un texte à analyser');return;}
  const parsed=bv4RecipeFromText(raw,'Recette depuis un texte');
  bv4Review(parsed,{method:'Texte / sous-titres',sourceUrl:String(data.get('sourceUrl')||browserPendingSourceURL||''),raw,message:'Texte analysé localement : les paroles et sous-titres sans structure claire nécessitent parfois une correction.'});
 }

 if(form.id==='bv4-media-form'){e.preventDefault();e.stopImmediatePropagation();bv4ImportMedia(form);}
 if(form.id==='bv4-image-form'){e.preventDefault();e.stopImmediatePropagation();bv4ImportImage(form);}
 if(form.id==='bv4-review-form'){e.preventDefault();e.stopImmediatePropagation();bv4SaveReview(form);}
},true);
// Display correct browser-only identity in UI. Old V2 data remains compatible.
document.querySelector('.side-identity small')?.replaceChildren(document.createTextNode('Bibliothèque dans le navigateur · extraction en ligne · données locales'));
render();

  </script>
